[build]
  functions = "netlify/functions"
  publish   = "."

# Forțează CORS pe toate funcțiile
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Headers = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

# SEO: secțiuni și fișiere care nu trebuie indexate (nu intră în sitemap; scripts/sitemap_build.py citește lista de aici)
[[headers]]
  for = "/biohack"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/biohack.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/biohack/*"
  [headers.values]
    X-Robots-Tag = "noindex"

