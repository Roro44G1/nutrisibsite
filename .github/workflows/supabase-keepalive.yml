name: Supabase Keep-Alive

on:
  schedule:
    # zilnic la 06:00 UTC (~09:00 vara / 08:00 iarna, ora României)
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # permite și rulare manuală, din tab-ul Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (nutrisib_context)
        run: |
          STATUS=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            "https://cwdbejilkbgdolywnozi.supabase.co/rest/v1/nutrisib_context?select=titlu&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP status: $STATUS"
          cat /tmp/resp.json
          if [ "$STATUS" -ge 400 ]; then
            echo "Ping esuat cu status $STATUS"
            exit 1
          fi
